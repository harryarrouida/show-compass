name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          GROQ_API_KEY: build-verification-placeholder
          NEXT_PUBLIC_TMDB_API_KEY: build-verification-placeholder
          NEXT_PUBLIC_TRAKT_CLIENT_ID: build-verification-placeholder
